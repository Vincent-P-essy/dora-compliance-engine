name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa \
            https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rego syntax, formatting and unit tests
        run: |
          opa check engine/policies
          opa fmt --list --fail engine/policies
          opa test engine/policies tests/test_policies/rego -v

      - name: Python tests (coverage gate 90%)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dora-compliance-engine:ci .
